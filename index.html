<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora por Voz</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/display.css">
    <link rel="stylesheet" href="css/teclado.css">
    <link rel="stylesheet" href="css/historial.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="app-shell">
        <header class="app-header">
            <i class="fa-solid fa-calculator"></i>
            <h1>Calculadora</h1>
            <button type="button" id="btn-ir-historial" class="btn-header-icono" aria-label="Ver historial">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
        </header>

        <!-- PANTALLA: CALCULADORA -->
        <section id="pantalla-calculadora" class="pantalla">

            <div class="pantalla-display">
                <div id="pantalla-pendiente" class="display-pendiente"></div>
                <div id="pantalla-principal" class="display-principal">0</div>
            </div>

            <div class="acciones-display">
                <button type="button" id="btn-dictar-numero" class="btn-voz-calc" aria-label="Dictar número por voz">
                    <i class="fa-solid fa-microphone"></i> Dictar
                </button>
                <button type="button" id="btn-leer-pantalla" class="btn-leer-calc" aria-label="Escuchar pantalla">
                    <i class="fa-solid fa-volume-high"></i> Escuchar
                </button>
            </div>

            <div id="cinta-calculo" class="cinta-calculo"></div>

            <button type="button" id="btn-leer-cinta" class="btn-leer-todo">
                <i class="fa-solid fa-list-ul"></i> Escuchar todos los números ingresados
            </button>

            <div id="teclado" class="teclado">
                <button type="button" class="tecla tecla-funcion" data-tecla="C">C</button>
                <button type="button" class="tecla tecla-funcion" data-tecla="⌫"><i class="fa-solid fa-delete-left"></i></button>
                <button type="button" class="tecla tecla-funcion" data-tecla="±">±</button>
                <button type="button" class="tecla tecla-operador" data-tecla="÷">÷</button>

                <button type="button" class="tecla tecla-numero" data-tecla="7">7</button>
                <button type="button" class="tecla tecla-numero" data-tecla="8">8</button>
                <button type="button" class="tecla tecla-numero" data-tecla="9">9</button>
                <button type="button" class="tecla tecla-operador" data-tecla="×">×</button>

                <button type="button" class="tecla tecla-numero" data-tecla="4">4</button>
                <button type="button" class="tecla tecla-numero" data-tecla="5">5</button>
                <button type="button" class="tecla tecla-numero" data-tecla="6">6</button>
                <button type="button" class="tecla tecla-operador" data-tecla="-">−</button>

                <button type="button" class="tecla tecla-numero" data-tecla="1">1</button>
                <button type="button" class="tecla tecla-numero" data-tecla="2">2</button>
                <button type="button" class="tecla tecla-numero" data-tecla="3">3</button>
                <button type="button" class="tecla tecla-operador" data-tecla="+">+</button>

                <button type="button" class="tecla tecla-numero tecla-cero" data-tecla="0">0</button>
                <button type="button" class="tecla tecla-numero" data-tecla=".">.</button>
                <button type="button" class="tecla tecla-igual" data-tecla="=">=</button>
            </div>
        </section>

        <!-- PANTALLA: HISTORIAL -->
        <section id="pantalla-historial" class="pantalla">
            <div class="tarjeta">
                <h2 class="titulo-pantalla">Historial de Cálculos</h2>
                <div id="lista-historial" class="lista-historial"></div>
            </div>

            <div class="btn-fila">
                <button type="button" id="btn-historial-volver" class="btn-grande btn-secundario">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
                <button type="button" id="btn-vaciar-historial" class="btn-grande btn-peligro">
                    <i class="fa-solid fa-trash-can"></i> Vaciar Historial
                </button>
            </div>
        </section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
